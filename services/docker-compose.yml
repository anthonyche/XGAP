services:
  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5-community}
    container_name: xgap-neo4j
    restart: unless-stopped
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-xgap-lab-password}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins
      - ../examples/financial_risk:/var/lib/neo4j/import/financial_risk:ro

  fuseki:
    image: ${FUSEKI_IMAGE:-stain/jena-fuseki:latest}
    container_name: xgap-fuseki
    restart: unless-stopped
    ports:
      - "${FUSEKI_PORT:-3030}:3030"
    environment:
      ADMIN_PASSWORD: ${FUSEKI_ADMIN_PASSWORD:-xgap-lab-password}
      FUSEKI_DATASET_1: ${FUSEKI_DATASET_NAME:-xgap}
    volumes:
      - fuseki_data:/fuseki
      - ../examples/financial_risk:/staging/financial_risk:ro

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  neo4j_plugins:
  fuseki_data:

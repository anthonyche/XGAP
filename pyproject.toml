[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xgap"
version = "0.1.0"
description = "Cost-aware agentic federated graph-query system"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest"]
test-sparql = ["pytest", "rdflib==7.1.4"]
parquet = ["pyarrow>=15"]

[project.scripts]
xgap-local-ui = "xgap.ui.local_app:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
